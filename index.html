<script>
/* ============================================================================
 * GROVIA — single-page app
 * One file: markup + styles + client + router + every view built so far.
 * ==========================================================================*/

/* ---------------------------------------------------------------- API ---- */
const GroviaAPI = (function () {
  'use strict';

  // TODO: replace with your deployed Apps Script Web App URL.
  const API_URL = 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec';
  const SESSION_KEY = 'grovia_session';
  const CHUNK_BYTES = 5 * 1024 * 1024;

  async function apiGet() {
    const res = await fetch(API_URL, { method: 'GET' });
    if (!res.ok) throw new Error('network_error_' + res.status);
    return res.json();
  }

  async function apiPost(action, payload) {
    const body = JSON.stringify(Object.assign({ action: action }, payload || {}));
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: body,
    });
    if (!res.ok) throw new Error('network_error_' + res.status);
    return res.json();
  }

  let _dbCache = null;

  async function getDb(force) {
    if (_dbCache && !force) return _dbCache;
    _dbCache = await apiGet();
    return _dbCache;
  }

  async function pushDb(mutator, maxRetries) {
    maxRetries = typeof maxRetries === 'number' ? maxRetries : 3;
    let db = await getDb(true);
    for (let attempt = 0; attempt <= maxRetries; attempt++) {
      const draft = JSON.parse(JSON.stringify(db));
      mutator(draft);
      const result = await apiPost('write', { version: draft.version, data: draft });
      if (result.error === 'version_conflict') {
        db = result.current;
        _dbCache = db;
        continue;
      }
      if (result.error) throw new Error(result.error);
      _dbCache = result.data;
      return result.data;
    }
    throw new Error('write_failed_after_retries');
  }

  function getSession() {
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function setSession(user) { localStorage.setItem(SESSION_KEY, JSON.stringify(user)); }
  function clearSession() { localStorage.removeItem(SESSION_KEY); }
  function isLoggedIn() { return !!getSession(); }

  async function refreshSession() {
    const session = getSession();
    if (!session) return null;
    const db = await getDb(true);
    const fresh = db.users.find(function (u) { return u.id === session.id; });
    if (fresh) setSession(fresh);
    return fresh || null;
  }

  async function sha256Hex(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }

  async function login(email, password) {
    const clientHash = await sha256Hex(password);
    const result = await apiPost('login', { email: email, password: clientHash });
    if (result.error) throw new Error(result.error);
    setSession(result);
    return result;
  }

  function logout() { clearSession(); }

  async function requestPasswordReset(email) {
    return apiPost('requestPasswordReset', { email: email });
  }

  async function resetPassword(token, newPassword) {
    const clientHash = await sha256Hex(newPassword);
    return apiPost('resetPassword', { token: token, newPassword: clientHash });
  }

  async function signup(opts) {
    const name = opts.name, email = opts.email, password = opts.password;
    const referredBy = opts.referredBy || null;

    const db = await getDb(true);
    const taken = db.users.some(function (u) { return u.email.toLowerCase() === email.toLowerCase(); });
    if (taken) throw new Error('email_already_registered');

    const clientHash = await sha256Hex(password);
    const salt = crypto.randomUUID();
    const passwordHash = await sha256Hex(clientHash + salt);
    const id = crypto.randomUUID();

    const newUser = {
      id: id, name: name, email: email, salt: salt, passwordHash: passwordHash,
      referralCode: id.slice(0, 8), referredBy: referredBy,
      creatorSub: { active: false, expiresAt: null, graceUntil: null },
      affiliateSub: { active: false, expiresAt: null, graceUntil: null },
      creatorWallet: 0, affiliateWallet: 0, referralWallet: 0, roleId: null,
      createdAt: new Date().toISOString(),
    };

    await pushDb(function (draft) { draft.users.push(newUser); });

    const publicUser = Object.assign({}, newUser);
    delete publicUser.salt;
    delete publicUser.passwordHash;
    setSession(publicUser);
    return publicUser;
  }

  function blobToBase64(blob) {
    return new Promise(function (resolve, reject) {
      const reader = new FileReader();
      reader.onload = function () { resolve(reader.result.split(',')[1]); };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  async function uploadFile(file, onProgress) {
    onProgress = onProgress || function () {};
    const totalChunks = Math.max(1, Math.ceil(file.size / CHUNK_BYTES));
    const start = await apiPost('startUpload', { filename: file.name, mimeType: file.type, totalChunks: totalChunks });
    if (start.error) throw new Error(start.error);
    const uploadId = start.uploadId;
    for (let i = 0; i < totalChunks; i++) {
      const blob = file.slice(i * CHUNK_BYTES, (i + 1) * CHUNK_BYTES);
      const base64Piece = await blobToBase64(blob);
      const chunkResult = await apiPost('uploadChunk', { uploadId: uploadId, chunkIndex: i, base64Piece: base64Piece });
      if (chunkResult.error) throw new Error(chunkResult.error);
      onProgress((i + 1) / totalChunks);
    }
    const final = await apiPost('finalizeUpload', { uploadId: uploadId });
    if (final.error) throw new Error(final.error);
    return final.fileId;
  }

  async function uploadImage(file) {
    const base64 = await blobToBase64(file);
    const result = await apiPost('uploadImage', { base64: base64, filename: file.name, mimeType: file.type });
    if (result.error) throw new Error(result.error);
    return result.url;
  }

  async function getDownloadLink(orderId, buyerEmail) {
    return apiPost('getDownloadLink', { orderId: orderId, buyerEmail: buyerEmail });
  }

  async function verifyPayment(txRef, targetType, targetId) {
    return apiPost('verifyPayment', { txRef: txRef, targetType: targetType, targetId: targetId });
  }

  async function getBanks(country) {
    return apiPost('getBanks', { country: country });
  }
  async function resolveAccount(opts) {
    return apiPost('resolveAccount', { country: opts.country, accountNumber: opts.accountNumber, accountBank: opts.accountBank });
  }
  async function getPayoutConfig(country) {
    return apiPost('getPayoutConfig', { country: country });
  }

  function isSubActive(sub) {
    if (!sub) return false;
    if (sub.active) return true;
    if (sub.graceUntil && Date.now() < new Date(sub.graceUntil).getTime()) return true;
    return false;
  }
  function isSubExpired(sub) {
    if (!sub) return true;
    if (sub.active) return false;
    if (!sub.graceUntil) return true;
    return Date.now() >= new Date(sub.graceUntil).getTime();
  }
  function hasPermission(user, db, permission) {
    if (!user || !user.roleId || !db) return false;
    const role = db.roles.find(function (r) { return r.id === user.roleId; });
    if (!role) return false;
    if (role.name === 'Super Admin') return true;
    return role.permissions.indexOf(permission) !== -1;
  }

  return {
    getDb: getDb, pushDb: pushDb,
    getSession: getSession, setSession: setSession, clearSession: clearSession, isLoggedIn: isLoggedIn, refreshSession: refreshSession,
    login: login, logout: logout, signup: signup, requestPasswordReset: requestPasswordReset, resetPassword: resetPassword,
    uploadFile: uploadFile, uploadImage: uploadImage, getDownloadLink: getDownloadLink, verifyPayment: verifyPayment,
    getBanks: getBanks, resolveAccount: resolveAccount, getPayoutConfig: getPayoutConfig,
    isSubActive: isSubActive, isSubExpired: isSubExpired, hasPermission: hasPermission, sha256Hex: sha256Hex,
  };
})();

/* ---------------------------------------------------------------- utils -- */
const FLW_PUBLIC_KEY = 'FLWPUBK_TEST-REPLACE_ME-X'; // TODO: your Flutterwave public key — used by every checkout flow (subscriptions, product purchases)

function cssUrlSafe(url) {
  // Escapes a URL for safe interpolation inside a CSS url('...') value embedded in an HTML style attribute.
  return escapeHtml(encodeURI(url)).replace(/'/g, '%27').replace(/\(/g, '%28').replace(/\)/g, '%29');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
function formatDate(iso) {
  if (!iso) return '';
  try { return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); }
  catch (e) { return iso; }
}
function logoSvg(size) {
  size = size || 40;
  return '<svg viewBox="0 0 32 32" width="' + size + '" height="' + size + '" role="img" aria-hidden="true"><use href="#lg"></use></svg>';
}

/* --------------------------------------------------------------- router -- */
let currentRoute = '/';
let currentParams = {};

const routes = [
  { path: '/', view: viewLanding },
  { path: '/catalog', view: viewCatalog },
  { path: '/store/:id', view: viewStore },
  { path: '/product/:id', view: viewProduct },
  { path: '/order-status', view: viewOrderStatus },
  { path: '/login', view: viewLogin },
  { path: '/signup', view: viewSignup },
  { path: '/forgot-password', view: viewForgotPassword },
  { path: '/reset-password', view: viewResetPassword },
  { path: '/creator/dashboard', view: viewCreatorDashboard, auth: true },
  { path: '/creator/store', view: viewCreatorStoreSettings, auth: true },
  { path: '/creator/products', view: viewCreatorProducts, auth: true },
  { path: '/creator/product/new', view: viewCreatorProductEdit, auth: true },
  { path: '/creator/product/:id', view: viewCreatorProductEdit, auth: true },
  { path: '/creator/wallet', view: viewCreatorWallet, auth: true },
  { path: '/affiliate/dashboard', view: viewAffiliateDashboard, auth: true },
  { path: '/affiliate/browse', view: viewAffiliateBrowse, auth: true },
  { path: '/affiliate/wallet', view: viewAffiliateWallet, auth: true },
  { path: '/referrals', view: viewReferrals, auth: true },
  { path: '/welcome', view: viewWelcome, auth: true },
  { path: '/account', view: viewAccount, auth: true },
];

function parseHash() {
  let h = window.location.hash;
  if (!h) h = '#/';
  if (h.charAt(0) !== '#' || h.charAt(1) !== '/') return null; // plain in-page anchor — not an app route
  h = h.slice(1);
  const parts = h.split('?');
  const path = parts[0];
  const queryString = parts[1];
  const params = {};
  if (queryString) new URLSearchParams(queryString).forEach(function (v, k) { params[k] = v; });
  return { path: path || '/', params: params };
}

function go(path) { window.location.hash = '#' + path; }
function matchRoute(path) {
  const segs = path.split('/').filter(Boolean);
  for (let i = 0; i < routes.length; i++) {
    const route = routes[i];
    const routeSegs = route.path.split('/').filter(Boolean);
    if (routeSegs.length !== segs.length) continue;
    const routeParams = {};
    let matched = true;
    for (let j = 0; j < routeSegs.length; j++) {
      if (routeSegs[j].charAt(0) === ':') {
        routeParams[routeSegs[j].slice(1)] = decodeURIComponent(segs[j]);
      } else if (routeSegs[j] !== segs[j]) {
        matched = false;
        break;
      }
    }
    if (matched) return { route: route, params: routeParams };
  }
  return null;
}

async function renderRoute() {
  const parsed = parseHash();
  if (!parsed) return; // let the browser handle plain #anchor scrolling

  const path = parsed.path;
  const match = matchRoute(path);
  const params = match ? Object.assign({}, parsed.params, match.params) : parsed.params;

  if (match && match.route.auth && !GroviaAPI.isLoggedIn()) {
    go('/login?next=' + encodeURIComponent(path));
    return;
  }

  currentRoute = path;
  currentParams = params;
  renderHeader();

  const app = document.getElementById('app');

  if (!match) {
    app.innerHTML = viewComingSoon(path);
    window.scrollTo(0, 0);
    if (window.lucide) lucide.createIcons();
    return;
  }

  app.innerHTML = '<div class="wrap"><p class="skeleton-text">Loading…</p></div>';
  try {
    const result = await match.route.view(params);
    if (result && result.html) {
      app.innerHTML = result.html;
      if (result.after) result.after();
    }
  } catch (err) {
    console.error(err);
    app.innerHTML = '<div class="wrap"><p class="skeleton-text">Something went wrong loading this page. <a href="#/" style="color:var(--brand-deep);font-weight:600;">Go home</a></p></div>';
  }
  if (window.lucide) lucide.createIcons();
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', renderRoute);
window.addEventListener('DOMContentLoaded', function () {
  document.getElementById('brand-home').addEventListener('click', function () { go('/'); });
  renderRoute();
});

/* ----------------------------------------------------------------- nav --- */
function subBadge(sub) {
  if (!sub) return '';
  if (GroviaAPI.isSubActive(sub) && sub.active) return '<span class="nav-badge active">active</span>';
  if (GroviaAPI.isSubActive(sub)) return '<span class="nav-badge grace">grace</span>';
  return '';
}

function renderHeader() {
  const user = GroviaAPI.getSession();
  const isLanding = currentRoute === '/';
  const navLinksEl = document.getElementById('nav-links');
  const navRightEl = document.getElementById('nav-right');
  const mobileEl = document.getElementById('mobile-menu');

  let centerLinks = '<a href="#/catalog">Browse products</a>';
  if (isLanding) {
    centerLinks += '<a href="#how-it-works">How it works</a><a href="#for-creators">For creators</a><a href="#for-affiliates">For affiliates</a>';
  } else if (user) {
    centerLinks += '<a href="#/creator/dashboard">Creator' + subBadge(user.creatorSub) + '</a>';
    centerLinks += '<a href="#/affiliate/dashboard">Affiliate' + subBadge(user.affiliateSub) + '</a>';
    if (user.roleId) centerLinks += '<a href="admin.html">Admin</a>';
  }
  navLinksEl.innerHTML = centerLinks;

  let rightHtml, mobileHtml;
  if (!user) {
    rightHtml =
      '<a href="#/login" class="nav-cta-text">Log in</a>' +
      '<a href="#/signup" class="btn btn-primary">Get started</a>' +
      '<button class="menu-btn" id="menu-toggle" aria-label="Open menu" aria-expanded="false"><i data-lucide="menu" style="width:20px;height:20px;"></i></button>';
    mobileHtml = centerLinks + '<a href="#/login">Log in</a><a href="#/signup">Sign up</a>';
  } else {
    rightHtml =
      '<a href="#/account" class="nav-cta-text">' + escapeHtml((user.name || 'Account').split(' ')[0]) + '</a>' +
      '<button class="btn btn-ghost" id="logout-btn" type="button">Log out</button>' +
      '<button class="menu-btn" id="menu-toggle" aria-label="Open menu" aria-expanded="false"><i data-lucide="menu" style="width:20px;height:20px;"></i></button>';
    mobileHtml = centerLinks + '<a href="#/account">Account settings</a><button type="button" id="logout-btn-mobile">Log out</button>';
  }
  navRightEl.innerHTML = rightHtml;
  mobileEl.innerHTML = mobileHtml;

  const menuBtn = document.getElementById('menu-toggle');
  if (menuBtn) {
    menuBtn.addEventListener('click', function () {
      const open = mobileEl.classList.toggle('open');
      menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  }
  mobileEl.querySelectorAll('a').forEach(function (a) {
    a.addEventListener('click', function () {
      mobileEl.classList.remove('open');
      if (menuBtn) menuBtn.setAttribute('aria-expanded', 'false');
    });
  });

  function doLogout() {
    GroviaAPI.logout();
    mobileEl.classList.remove('open');
    go('/');
  }
  const logoutBtn = document.getElementById('logout-btn');
  const logoutBtnMobile = document.getElementById('logout-btn-mobile');
  if (logoutBtn) logoutBtn.addEventListener('click', doLogout);
  if (logoutBtnMobile) logoutBtnMobile.addEventListener('click', doLogout);

  if (window.lucide) lucide.createIcons();
}

async function viewCatalog() {

/* ---------------------------------------------------------------- product */
async function viewProduct(params) {
  const productId = params.id;
  const refCode = params.ref || null;

  let db;
  try {
    db = await GroviaAPI.getDb(true);
  } catch (err) {
    return { html: '<div class="wrap"><p class="skeleton-text">Couldn\u2019t load this product. Refresh to try again.</p></div>' };
  }

  const product = db.products.find(function (p) { return p.id === productId; });
  if (!product) {
    return {
      html:
        '<div class="wrap"><h1 class="page-title">Product not found</h1>' +
        '<p class="page-sub">This product link may be out of date.</p>' +
        '<a href="#/catalog" class="btn btn-primary">Browse products</a></div>',
    };
  }

  const store = db.stores.find(function (s) { return s.id === product.storeId; });
  const price = typeof product.price === 'number' ? product.price : Number(product.price) || 0;

  const cover = product.images && product.images[0]
    ? '<div class="buy-cover" style="background-image:url(\'' + cssUrlSafe(product.images[0]) + '\');"></div>'
    : '<div class="buy-cover buy-cover-fallback"><i data-lucide="package" style="width:34px;height:34px;"></i></div>';

  function shell(inner) {
    return (
      '<div class="wrap"><a class="back-link" id="product-back-link">\u2190 ' +
      (store ? escapeHtml(store.name) : 'Browse products') + '</a>' +
      cover +
      '<h1 class="page-title" style="margin-top:16px;">' + escapeHtml(product.name) + '</h1>' +
      (store ? '<p class="product-store" style="margin-bottom:10px;">by ' + escapeHtml(store.name) + '</p>' : '') +
      (product.description ? '<p class="page-sub">' + escapeHtml(product.description) + '</p>' : '') +
      '<div class="buy-price-row"><span class="buy-price">\u20a6' + price.toLocaleString() + '</span></div>' +
      inner + '</div>'
    );
  }

  function wireBack() {
    const back = document.getElementById('product-back-link');
    if (back) back.addEventListener('click', function () { go(store ? '/store/' + store.id : '/catalog'); });
  }

  const formHtml =
    '<div class="card"><div id="buy-alert" class="alert"></div>' +
    '<form id="buy-form" novalidate>' +
    '<div class="field"><label for="buyer-name">Full name</label><input type="text" id="buyer-name" required /></div>' +
    '<div class="field"><label for="buyer-email">Email</label><input type="email" id="buyer-email" required /></div>' +
    (refCode ? '<p class="field-hint">Purchasing via a shared affiliate link.</p>' : '') +
    '<button type="submit" class="btn btn-primary btn-wide" id="buy-submit-btn">Buy for \u20a6' + price.toLocaleString() + '</button>' +
    '</form></div>';

  async function onSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById('buy-submit-btn');
    const name = document.getElementById('buyer-name').value.trim();
    const email = document.getElementById('buyer-email').value.trim();
    function showAlert(msg) {
      const el = document.getElementById('buy-alert');
      el.textContent = msg; el.className = 'alert error';
    }
    document.getElementById('buy-alert').className = 'alert';
    if (!name) { showAlert('Enter your full name.'); return; }
    if (!email || email.indexOf('@') === -1) { showAlert('Enter a valid email.'); return; }

    btn.disabled = true; btn.textContent = 'Preparing checkout\u2026';

    const orderId = crypto.randomUUID();
    const txRef = 'grovia_order_' + orderId;

    try {
      await GroviaAPI.pushDb(function (draft) {
        draft.orders.push({
          id: orderId, productId: product.id,
          buyerName: name, buyerEmail: email,
          basePrice: price, affiliateRef: refCode || null,
          platformCut: 0, affiliateCommission: 0, creatorEarning: 0,
          status: 'pending', flutterwaveTxRef: txRef,
          createdAt: new Date().toISOString(), paidAt: null,
        });
      });
    } catch (err) {
      showAlert('Couldn\u2019t start checkout. Please try again.');
      btn.disabled = false; btn.textContent = 'Buy for \u20a6' + price.toLocaleString();
      return;
    }

    if (typeof FlutterwaveCheckout !== 'function') {
      showAlert('Payments are unavailable right now. Please try again shortly.');
      btn.disabled = false; btn.textContent = 'Buy for \u20a6' + price.toLocaleString();
      return;
    }

    FlutterwaveCheckout({
      public_key: FLW_PUBLIC_KEY,
      tx_ref: txRef,
      amount: price,
      currency: 'NGN',
      payment_options: 'card, mobilemoney, ussd',
      customer: { email: email, name: name },
      customizations: { title: 'Grovia \u2014 ' + product.name, description: 'Purchase of ' + product.name },
      callback: function (response) {
        go('/order-status?orderId=' + encodeURIComponent(orderId) + '&txRef=' + encodeURIComponent(response.transaction_id || response.tx_ref));
      },
      onclose: function () {
        const btnAgain = document.getElementById('buy-submit-btn');
        if (btnAgain) { btnAgain.disabled = false; btnAgain.textContent = 'Buy for \u20a6' + price.toLocaleString(); }
      },
    });
  }

  return {
    html: shell(formHtml),
    after: function () {
      wireBack();
      document.getElementById('buy-form').addEventListener('submit', onSubmit);
    },
  };
}

/* ------------------------------------------------------------ order status */
async function viewOrderStatus(params) {
  const orderId = params.orderId;
  const txRef = params.txRef;

  function shell(inner) {
    return '<div class="wrap"><h1 class="page-title">Order status</h1>' + inner + '</div>';
  }

  function retryCard(message, label) {
    return {
      html: shell(
        '<div class="card"><p style="margin:0 0 16px;color:var(--text-secondary);font-size:14px;">' + message + '</p>' +
        '<button class="btn btn-primary btn-wide" id="retry-verify-btn">' + label + '</button></div>'
      ),
      after: function () {
        const btn = document.getElementById('retry-verify-btn');
        if (btn) btn.addEventListener('click', function () { renderRoute(); });
      },
    };
  }

  if (!orderId || !txRef) {
    return {
      html: shell(
        '<p class="skeleton-text">This page needs a valid order reference. If you just completed a purchase, check your email for a receipt.</p>' +
        '<a href="#/catalog" class="btn btn-primary">Browse products</a>'
      ),
    };
  }

  let db;
  try {
    db = await GroviaAPI.getDb(true);
  } catch (err) {
    return { html: shell('<p class="skeleton-text">Couldn\u2019t load your order. Refresh to try again.</p>') };
  }

  let order = db.orders.find(function (o) { return o.id === orderId; });
  if (!order) {
    return {
      html: shell(
        '<p class="skeleton-text">We couldn\u2019t find this order.</p>' +
        '<a href="#/catalog" class="btn btn-primary">Browse products</a>'
      ),
    };
  }

  if (order.status !== 'paid') {
    try {
      const result = await GroviaAPI.verifyPayment(txRef, 'order', orderId);
      if (result.error) {
        return retryCard('We couldn\u2019t confirm this payment yet. If you completed checkout, this can take a moment \u2014 try again.', 'Check again');
      }
      db = await GroviaAPI.getDb(true);
      order = db.orders.find(function (o) { return o.id === orderId; });
    } catch (err) {
      return retryCard('Something went wrong confirming your payment.', 'Try again');
    }
  }

  if (!order || order.status !== 'paid') {
    return { html: shell('<p class="skeleton-text">This order hasn\u2019t been confirmed as paid yet.</p>') };
  }

  const product = db.products.find(function (p) { return p.id === order.productId; });
  const price = typeof order.basePrice === 'number' ? order.basePrice : Number(order.basePrice) || 0;

  const bodyHtml =
    '<div class="card">' +
    '<div class="order-paid-badge"><i data-lucide="check-circle" style="width:18px;height:18px;"></i> Payment confirmed</div>' +
    '<p style="margin:14px 0 4px;font-size:14px;color:var(--text-secondary);">' + escapeHtml(product ? product.name : 'Your purchase') + '</p>' +
    '<p style="margin:0 0 18px;font-size:22px;font-weight:800;color:var(--brand-deep);">\u20a6' + price.toLocaleString() + '</p>' +
    '<div id="download-alert" class="alert"></div>' +
    '<button class="btn btn-primary btn-wide" id="download-btn" type="button">Get my download link</button>' +
    '</div>';

  return {
    html: shell(bodyHtml),
    after: function () {
      const btn = document.getElementById('download-btn');
      if (!btn) return;
      btn.addEventListener('click', async function () {
        btn.disabled = true; btn.textContent = 'Preparing your link\u2026';
        function showAlert(msg) {
          const el = document.getElementById('download-alert');
          if (el) { el.textContent = msg; el.className = 'alert error'; }
        }
        try {
          const result = await GroviaAPI.getDownloadLink(order.id, order.buyerEmail);
          if (result.error) {
            showAlert('Couldn\u2019t get your download link. Contact support with your order reference.');
            btn.disabled = false; btn.textContent = 'Get my download link';
            return;
          }
          const alertEl = document.getElementById('download-alert');
          if (alertEl) {
            alertEl.outerHTML = '<a href="' + escapeHtml(result.url) + '" target="_blank" rel="noopener" class="btn btn-outline btn-wide" style="margin-bottom:12px;">Open download</a>';
          }
          btn.style.display = 'none';
        } catch (err) {
          showAlert('Couldn\u2019t get your download link. Contact support with your order reference.');
          btn.disabled = false; btn.textContent = 'Get my download link';
        }
      });
    },
  };
}

      if (!prefersReducedMotion && 'IntersectionObserver' in window) {

          });

        revealEls.forEach(function (el) { io.observe(el); });
      } else {
        revealEls.forEach(function (el) { el.classList.add('in-view'); });
      }
    },
  };
}

function viewLogin() {

  const html =
    '<div class="wrap"><div class="auth-wrap"><div class="auth-card">' +
    '<div class="auth-logo">' + logoSvg() + '</div>' +
    '<h1 class="auth-title">Welcome back</h1><p class="auth-sub">Log in to your Grovia account</p>' +
    '<div id="form-alert" class="alert"></div>' +
    '<form id="login-form" novalidate>' +
    '<div class="field"><label for="email">Email</label><input type="email" id="email" autocomplete="email" required /></div>' +
    '<div class="field"><div class="field-row"><label for="password">Password</label><a href="#/forgot-password" class="forgot-link">Forgot?</a></div>' +
    '<input type="password" id="password" autocomplete="current-password" required /></div>' +

    '</form><p class="auth-footer">Don\'t have an account? <a href="#/signup">Sign up</a></p>' +
    '</div></div></div>';

  return {
    html: html,

      function showAlert(msg, kind) {
        const el = document.getElementById('form-alert');
        el.textContent = msg;
        el.className = 'alert ' + (kind || 'error');
      }
      document.getElementById('login-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        document.getElementById('form-alert').className = 'alert';
        if (!email || !password) { showAlert('Enter your email and password.'); return; }
        btn.disabled = true; btn.textContent = 'Logging in…';
        try {
          await GroviaAPI.login(email, password);
          go(currentParams.next || '/');
        } catch (err) {
          showAlert(err.message === 'invalid_credentials' ? 'That email and password don\u2019t match. Try again.' : 'Something went wrong. Please try again.');
          btn.disabled = false; btn.textContent = 'Log in';
        }
      });
    },
  };
}

function viewResetPassword(params) {
  const token = params.token;

  const html =
    '<div class="wrap"><div class="auth-wrap"><div class="auth-card">' +
    '<div id="form-view" style="display:' + (token ? 'block' : 'none') + ';">' +
    '<div class="auth-logo">' + logoSvg() + '</div>' +
    '<h1 class="auth-title">Set a new password</h1><p class="auth-sub">Choose something you haven\'t used before.</p>' +
    '<div id="form-alert" class="alert"></div>' +
    '<form id="reset-form" novalidate>' +
    '<div class="field"><label for="password">New password</label><input type="password" id="password" autocomplete="new-password" minlength="8" required /><p class="field-hint">At least 8 characters.</p></div>' +
    '<div class="field"><label for="confirm">Confirm new password</label><input type="password" id="confirm" autocomplete="new-password" required /></div>' +
    '<button type="submit" class="btn btn-primary btn-wide" id="submit-btn">Reset password</button>' +
    '</form></div>' +
    '<div id="success-view" style="display:none; text-align:center;">' +
    '<div class="state-icon ok">✓</div><h1 class="auth-title">Password updated</h1><p class="auth-sub">You can now log in with your new password.</p>' +
    '<a href="#/login" class="btn btn-primary btn-wide">Go to log in</a></div>' +
    '<div id="invalid-view" style="display:' + (token ? 'none' : 'block') + '; text-align:center;">' +
    '<div class="state-icon bad">!</div><h1 class="auth-title">Link expired</h1><p class="auth-sub">This reset link is invalid or has expired. Request a new one to continue.</p>' +
    '<a href="#/forgot-password" class="btn btn-primary btn-wide">Request a new link</a></div>' +
    '</div></div></div>';

  return {
    html: html,
    after: function () {
      function show(id) {
        ['form-view', 'success-view', 'invalid-view'].forEach(function (v) {
          document.getElementById(v).style.display = v === id ? 'block' : 'none';
        });
      }
      const form = document.getElementById('reset-form');
      if (!form) return;
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;
        function showAlert(msg) {
          const el = document.getElementById('form-alert');
          el.textContent = msg; el.className = 'alert error';
        }
        document.getElementById('form-alert').className = 'alert';
        if (password.length < 8) { showAlert('Your password needs to be at least 8 characters.'); return; }
        if (password !== confirm) { showAlert('Those passwords don\u2019t match.'); return; }
        btn.disabled = true; btn.textContent = 'Saving…';
        try {
          const result = await GroviaAPI.resetPassword(token, password);
          if (result && result.error) throw new Error(result.error);
          show('success-view');
        } catch (err) {
          if (err.message === 'invalid_or_expired_token') show('invalid-view');
          else { showAlert('Something went wrong. Please try again.'); btn.disabled = false; btn.textContent = 'Reset password'; }
        }
      });
    },
  };
}

/* ------------------------------------------------------------ creator: dashboard */
async function viewCreatorDashboard() {
  let db, user;
  try {
    db = await GroviaAPI.getDb(true);
    user = GroviaAPI.getSession();
    const fresh = db.users.find(function (u) { return u.id === user.id; });
    if (fresh) { user = fresh; GroviaAPI.setSession(user); }
  } catch (err) {
    return { html: '<div class="wrap"><p class="skeleton-text">Couldn\u2019t load your dashboard. Refresh to try again.</p></div>' };
  }

  const sub = user.creatorSub;
  const active = GroviaAPI.isSubActive(sub);
  const inGrace = active && !sub.active;

  let bodyHtml, after;

  function linkCard(path, icon, title, desc) {
    return (
      '<div class="link-card" data-nav="' + path + '">' +
      '<span class="link-icon">' + icon + '</span>' +
      '<span><p class="link-title">' + escapeHtml(title) + '</p><p class="link-desc">' + escapeHtml(desc) + '</p></span>' +
      '<span class="link-arrow">→</span></div>'
    );
  }

  async function startSubscriptionCheckout(fee) {
    const btn = document.getElementById('subscribe-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Preparing checkout…'; }
    const subId = crypto.randomUUID();
    const txRef = 'grovia_sub_' + subId;

    function showGateAlert(message) {
      const el = document.getElementById('gate-alert');
      if (!el) return;
      el.textContent = message; el.className = 'alert error';
    }

    try {
      await GroviaAPI.pushDb(function (draft) {
        draft.subscriptions.push({
          id: subId, userId: user.id, role: 'creator', amount: fee, status: 'pending',
          flutterwaveTxRef: txRef, createdAt: new Date().toISOString(), paidAt: null, expiresAt: null,
        });
      });
    } catch (err) {
      showGateAlert('Couldn\u2019t start checkout. Please try again.');
      if (btn) { btn.disabled = false; btn.textContent = 'Subscribe now'; }
      return;
    }

    if (typeof FlutterwaveCheckout !== 'function') {
      showGateAlert('Payments are unavailable right now. Please try again shortly.');
      if (btn) { btn.disabled = false; btn.textContent = 'Subscribe now'; }
      return;
    }

    FlutterwaveCheckout({
      public_key: FLW_PUBLIC_KEY,
      tx_ref: txRef,
      amount: fee,
      currency: 'NGN',
      payment_options: 'card, mobilemoney, ussd',
      customer: { email: user.email, name: user.name },
      customizations: { title: 'Grovia — Creator subscription', description: '1-year creator subscription' },
      callback: async function (response) {
        try {
          const result = await GroviaAPI.verifyPayment(response.transaction_id || response.tx_ref, 'subscription', subId);
          if (result.error) throw new Error(result.error);
          renderRoute();
        } catch (err) {
          showGateAlert('Payment received but verification failed. Contact support with reference ' + txRef + '.');
        }
      },
      onclose: function () { if (btn) { btn.disabled = false; btn.textContent = 'Subscribe now'; } },
    });
  }

  if (!active) {
    const fee = (db.platformSettings && db.platformSettings.creatorYearlyFee) || 0;
    bodyHtml =
      '<div class="gate-card"><div class="gate-icon">🌱</div><h2>Become a Grovia creator</h2>' +
      '<p>Open a store, list digital products, and set your own price — for one flat yearly fee.</p>' +
      '<p class="gate-price">₦' + fee.toLocaleString() + ' <span>/ year</span></p>' +
      '<div id="gate-alert" class="alert"></div>' +
      '<button class="btn btn-primary btn-wide" id="subscribe-btn">Subscribe now</button></div>';

    after = function () {
      document.getElementById('subscribe-btn').addEventListener('click', function () { startSubscriptionCheckout(fee); });
    };
  } else {
    const stores = db.stores.filter(function (s) { return s.ownerId === user.id; });
    const productCount = db.products.filter(function (p) { return stores.some(function (s) { return s.id === p.storeId; }); }).length;

    let html = '';
    if (inGrace) {
      html +=
        '<div class="banner warn">⏳ Your subscription lapsed and you\u2019re in the grace period until ' +
        formatDate(sub.graceUntil) + '. <a href="#" id="renew-link">Renew now</a> to keep your store open.</div>';
    }
    html +=
      '<div class="stat-grid">' +
      '<div class="stat-card"><p class="stat-label">Wallet balance</p><p class="stat-value">₦' + user.creatorWallet.toLocaleString() + '</p></div>' +
      '<div class="stat-card"><p class="stat-label">Products live</p><p class="stat-value">' + productCount + '</p></div>' +
      '<div class="stat-card"><p class="stat-label">Referral wallet</p><p class="stat-value">₦' + (Number(user.referralWallet) || 0).toLocaleString() + '</p></div>' +
      '</div>';
    html += '<div class="section-heading">Quick actions</div><div class="link-list">';
    html += linkCard('/creator/product/new', '➕', 'Create a product', 'List an ebook, course, or template');
    html += linkCard('/creator/products', '📦', 'Your products', productCount + ' product' + (productCount === 1 ? '' : 's') + ' listed');
    html += linkCard('/creator/store', '🏪', stores.length ? 'Store settings' : 'Set up your store', stores.length ? stores[0].name : 'Give your store a name and description');
    html += linkCard('/creator/wallet', '💰', 'Wallet', 'View earnings and request a withdrawal');
    html += linkCard('/referrals', '🎁', 'Refer & earn', 'Invite people to Grovia and earn on every payment');
    html += '</div>';

    bodyHtml = html;

    after = function () {
      document.querySelectorAll('.link-card[data-nav]').forEach(function (el) {
        el.addEventListener('click', function () { go(el.getAttribute('data-nav')); });
      });
      const renewLink = document.getElementById('renew-link');
      if (renewLink) {
        renewLink.addEventListener('click', function (e) {
          e.preventDefault();
          const fee = (db.platformSettings && db.platformSettings.creatorYearlyFee) || 0;
          startSubscriptionCheckout(fee);
        });
      }
    };
  }

  return {
    html: '<div class="wrap"><h1 class="page-title">Creator dashboard</h1><p class="page-sub">Manage your store, products, and earnings.</p>' + bodyHtml + '</div>',
    after: after,
  };
}

      el.textContent = message; el.className = 'alert error';
    }

    try {
      await GroviaAPI.pushDb(function (draft) {
        draft.subscriptions.push({
          id: subId, userId: user.id, role: 'affiliate', amount: fee, status: 'pending',
          flutterwaveTxRef: txRef, createdAt: new Date().toISOString(), paidAt: null, expiresAt: null,

      callback: async function (response) {

  } else {

    let html = '';
    if (inGrace) {
      html +=
        '<div class="banner warn">\u23f3 Your subscription lapsed and you\u2019re in the grace period until ' +
        formatDate(sub.graceUntil) + '. <a href="#" id="renew-link">Renew now</a> to keep sharing links.</div>';
    }
    html +=
      '<div class="stat-grid">' +
      '<div class="stat-card"><p class="stat-label">Wallet balance</p><p class="stat-value">\u20a6' + user.affiliateWallet.toLocaleString() + '</p></div>' +
      '<div class="stat-card"><p class="stat-label">Sales referred</p><p class="stat-value">' + referredOrders.length + '</p></div>' +
      '<div class="stat-card"><p class="stat-label">Referral wallet</p><p class="stat-value">\u20a6' + (Number(user.referralWallet) || 0).toLocaleString() + '</p></div>' +
      '</div>';
    html += '<p class="field-hint" style="margin:-14px 0 22px;">\u20a6' + totalEarned.toLocaleString() + ' in commission earned to date.</p>';
    html += '<div class="section-heading">Quick actions</div><div class="link-list">';

    html += linkCard('/affiliate/wallet', '\ud83d\udcb0', 'Wallet', 'View earnings and request a withdrawal');
    html += linkCard('/referrals', '\ud83c\udf81', 'Refer & earn', 'Invite people to Grovia and earn on every payment');
    html += '</div>';

  return {

async function viewCreatorStoreSettings() {
  const NAME_MAX = 60;
  const DESC_MAX = 280;

  let db, user;
  try {
    db = await GroviaAPI.getDb(true);
    user = GroviaAPI.getSession();
    const fresh = db.users.find(function (u) { return u.id === user.id; });
    if (fresh) { user = fresh; GroviaAPI.setSession(user); }
  } catch (err) {
    return { html: '<div class="wrap"><p class="skeleton-text">Couldn\u2019t load your store. Refresh to try again.</p></div>' };
  }

  function shell(inner) {
    return (
      '<div class="wrap"><a class="back-link" id="store-back-link">← Dashboard</a>' +
      '<h1 class="page-title">Store settings</h1><p class="page-sub">Give your store a name and description buyers will see.</p>' +
      inner + '</div>'
    );
  }

  function wireBack() {
    const back = document.getElementById('store-back-link');
    if (back) back.addEventListener('click', function () { go('/creator/dashboard'); });
  }

  if (!GroviaAPI.isSubActive(user.creatorSub)) {
    return {
      html: shell(
        '<div class="card"><p style="margin:0 0 16px;color:var(--text-secondary);font-size:14px;">You need an active creator subscription to set up a store.</p>' +
        '<a href="#/creator/dashboard" class="btn btn-primary">Go to dashboard</a></div>'
      ),
      after: wireBack,
    };
  }

  let store = db.stores.find(function (s) { return s.ownerId === user.id; }) || null;

  function render() {
    const isNew = !store;
    let html = '';
    if (!isNew) {
      const storeUrl = window.location.origin + window.location.pathname + '#/store/' + store.id;
      html +=
        '<div class="store-link-row"><span>Your store: <a href="' + storeUrl + '">' + storeUrl.replace(/^https?:\/\//, '') + '</a></span>' +
        '<button class="copy-btn" id="copy-link-btn" type="button">Copy</button></div>';
    }
    html +=
      '<div class="card"><div id="form-alert" class="alert"></div>' +
      '<form id="store-form" novalidate>' +
      '<div class="field"><label for="name">Store name</label>' +
      '<input type="text" id="name" maxlength="' + NAME_MAX + '" value="' + escapeHtml((store && store.name) || '') + '" required />' +
      '<p class="char-count" id="name-count">0 / ' + NAME_MAX + '</p></div>' +
      '<div class="field"><label for="description">Description</label>' +
      '<textarea id="description" rows="4" maxlength="' + DESC_MAX + '">' + escapeHtml((store && store.description) || '') + '</textarea>' +
      '<p class="field-hint">Shown at the top of your public store page.</p>' +
      '<p class="char-count" id="desc-count">0 / ' + DESC_MAX + '</p></div>' +
      '<button type="submit" class="btn btn-primary btn-wide" id="submit-btn">' + (isNew ? 'Create store' : 'Save changes') + '</button>' +
      '</form></div>';

    document.getElementById('app').innerHTML = shell(html);
    wireBack();

    const nameInput = document.getElementById('name');
    const descInput = document.getElementById('description');
    const nameCount = document.getElementById('name-count');
    const descCount = document.getElementById('desc-count');
    const updateCounts = function () {
      nameCount.textContent = nameInput.value.length + ' / ' + NAME_MAX;
      descCount.textContent = descInput.value.length + ' / ' + DESC_MAX;
    };
    nameInput.addEventListener('input', updateCounts);
    descInput.addEventListener('input', updateCounts);
    updateCounts();

    document.getElementById('store-form').addEventListener('submit', onSubmit);

    const copyBtn = document.getElementById('copy-link-btn');
    if (copyBtn) {
      copyBtn.addEventListener('click', async function () {
        const storeUrl = window.location.origin + window.location.pathname + '#/store/' + store.id;
        try {
          await navigator.clipboard.writeText(storeUrl);
          copyBtn.textContent = 'Copied!';
          setTimeout(function () { copyBtn.textContent = 'Copy'; }, 1500);
        } catch (e) { /* clipboard unavailable */ }
      });
    }
    if (window.lucide) lucide.createIcons();
  }

  async function onSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const name = document.getElementById('name').value.trim();
    const description = document.getElementById('description').value.trim();
    function showAlert(msg, kind) {
      const el = document.getElementById('form-alert');
      el.textContent = msg; el.className = 'alert ' + (kind || 'error');
    }
    document.getElementById('form-alert').className = 'alert';
    if (!name) { showAlert('Give your store a name.'); return; }

    btn.disabled = true; btn.textContent = 'Saving…';
    const isNew = !store;
    const storeId = store ? store.id : crypto.randomUUID();

    try {
      const saved = await GroviaAPI.pushDb(function (draft) {
        const existing = draft.stores.find(function (s) { return s.id === storeId; });
        if (existing) { existing.name = name; existing.description = description; }
        else draft.stores.push({ id: storeId, ownerId: user.id, name: name, description: description, createdAt: new Date().toISOString() });
      });
      db = saved;
      store = db.stores.find(function (s) { return s.id === storeId; });
      render();
      const el = document.getElementById('form-alert');
      el.textContent = isNew ? 'Store created!' : 'Changes saved.';
      el.className = 'alert info';
    } catch (err) {
      showAlert('Something went wrong. Please try again.');
      btn.disabled = false; btn.textContent = isNew ? 'Create store' : 'Save changes';
    }
  }

  return {
    html: '<div class="wrap"><p class="skeleton-text">Loading…</p></div>',
    after: render,
  };
}

      btn.addEventListener('click', function () { onDelete(btn.getAttribute('data-delete')); });
    });
  }

  async function onDelete(productId) {
    const product = products.find(function (p) { return p.id === productId; });
    if (!product) return;
    if (!window.confirm('Delete "' + product.name + '"? This can\u2019t be undone.')) return;
