      } else {
        fileSectionHtml =
          '<label class="btn btn-outline btn-wide" for="deliverable-input" style="cursor:pointer;">Choose deliverable file<input type="file" id="deliverable-input" style="display:none;" /></label>' +
          '<p class="field-hint">Buyers get this after a verified payment.</p>';
      }
    } else {
      fileSectionHtml = '<p class="field-hint">The deliverable file set at creation can\u2019t be changed here \u2014 contact support to replace it.</p>';
    }

    const html =
      '<div id="pe-alert" class="alert"></div>' +
      '<div class="card">' +
      '<div class="field"><label>Product images (up to 3)</label>' +
      '<div class="pe-thumbs">' + imagesHtml + addImageBtn + '</div>' +
      '<p class="field-hint">Shown on your store and product pages.</p></div>' +
      '<div class="field"><label for="pe-name">Product name</label>' +
      '<input type="text" id="pe-name" maxlength="' + NAME_MAX + '" value="' + escapeHtml((product && product.name) || '') + '" required /></div>' +
      '<div class="field"><label for="pe-price">Price (\u20a6)</label>' +
      '<input type="number" id="pe-price" min="0" step="1" value="' + ((product && product.price) || '') + '" required /></div>' +
      '<div class="field"><label for="pe-commission">Affiliate commission (%)</label>' +
      '<input type="number" id="pe-commission" min="' + commissionMin + '" max="' + commissionMax + '" step="1" value="' + ((product && product.commissionRate) || commissionMin) + '" required />' +
      '<p class="field-hint">Between ' + commissionMin + '% and ' + commissionMax + '%.</p></div>' +
      '<div class="field"><label for="pe-description">Description</label>' +
      '<textarea id="pe-description" rows="4" maxlength="' + DESC_MAX + '">' + escapeHtml((product && product.description) || '') + '</textarea></div>' +
      '<div class="field"><label>Deliverable file</label>' + fileSectionHtml + '</div>' +
      '<button type="submit" class="btn btn-primary btn-wide" id="pe-submit-btn">' + (isNew ? 'List product' : 'Save changes') + '</button>' +
      '</div>';

    document.getElementById('app').innerHTML = shell('<form id="pe-form" novalidate>' + html + '</form>');
    wireBack();
    if (window.lucide) lucide.createIcons();

    document.querySelectorAll('[data-remove-img]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        images.splice(Number(btn.getAttribute('data-remove-img')), 1);
        render();
      });
    });

    const imageInput = document.getElementById('image-input');
    if (imageInput) {
      imageInput.addEventListener('change', async function () {
        const file = imageInput.files[0];
        if (!file) return;
        try {
          const url = await GroviaAPI.uploadImage(file);
          images.push(url);
          render();
        } catch (err) {
          const alertEl = document.getElementById('pe-alert');
          if (alertEl) { alertEl.textContent = 'Couldn\u2019t upload that image. Please try again.'; alertEl.className = 'alert error'; }
        }
      });
    }

    const deliverableInput = document.getElementById('deliverable-input');
    if (deliverableInput) {
      deliverableInput.addEventListener('change', async function () {
        const file = deliverableInput.files[0];
        if (!file) return;
        fileUploadState = { uploading: true, progress: 0, doneName: null };
        render();
        try {
          uploadedFileId = await GroviaAPI.uploadFile(file, function (p) {
            fileUploadState.progress = p;
            const bar = document.querySelector('.pe-progress-bar');
            const hint = document.querySelector('.pe-progress + .field-hint');
            if (bar) bar.style.width = Math.round(p * 100) + '%';
            if (hint) hint.textContent = 'Uploading\u2026 ' + Math.round(p * 100) + '%';
          });
          fileUploadState = { uploading: false, progress: 1, doneName: file.name };
          render();
        } catch (err) {
          fileUploadState = { uploading: false, progress: 0, doneName: null };
          uploadedFileId = null;
          render();
          const alertEl = document.getElementById('pe-alert');
          if (alertEl) { alertEl.textContent = 'Couldn\u2019t upload that file. Please try again.'; alertEl.className = 'alert error'; }
        }
      });
    }

    document.getElementById('pe-form').addEventListener('submit', onSubmit);
  }

  async function onSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById('pe-submit-btn');
    const name = document.getElementById('pe-name').value.trim();
    const price = Number(document.getElementById('pe-price').value);
    const commissionRate = Number(document.getElementById('pe-commission').value);
    const description = document.getElementById('pe-description').value.trim();

    function showAlert(msg) {
      const el = document.getElementById('pe-alert');
      if (el) { el.textContent = msg; el.className = 'alert error'; }
    }
    const alertReset = document.getElementById('pe-alert');
    if (alertReset) alertReset.className = 'alert';

    if (!name) { showAlert('Give your product a name.'); return; }
    if (!price || price <= 0) { showAlert('Enter a price greater than 0.'); return; }
    if (isNaN(commissionRate) || commissionRate < commissionMin || commissionRate > commissionMax) {
      showAlert('Commission must be between ' + commissionMin + '% and ' + commissionMax + '%.');
      return;
    }
    if (isNew && !uploadedFileId) { showAlert('Upload the file buyers will receive.'); return; }
    if (fileUploadState.uploading) { showAlert('Wait for the file upload to finish.'); return; }

    btn.disabled = true; btn.textContent = 'Saving\u2026';

    const now = new Date().toISOString();
    const productId = isNew ? crypto.randomUUID() : product.id;

    try {
      await GroviaAPI.pushDb(function (draft) {
        if (isNew) {
          draft.products.push({
            id: productId, storeId: store.id, name: name, price: price, commissionRate: commissionRate,
            description: description, images: images, fileId: uploadedFileId,
            createdAt: now, updatedAt: now,
          });
        } else {
          const existing = draft.products.find(function (p) { return p.id === productId; });
          if (existing) {
            existing.name = name; existing.price = price; existing.commissionRate = commissionRate;
            existing.description = description; existing.images = images; existing.updatedAt = now;
          }
        }
      });
      go('/creator/products');
    } catch (err) {
      showAlert('Something went wrong. Please try again.');
      btn.disabled = false; btn.textContent = isNew ? 'List product' : 'Save changes';
    }
  }

  return { html: '<div class="wrap"><p class="skeleton-text">Loading…</p></div>', after: render };
}

/* ============================================================ WITHDRAWAL ==
 * Shared by the creator / affiliate / referral wallet views below. Handles:
 *  - one-time country capture (falls back to a picker if user.country is null)
 *  - reading payout config straight from db.supportedCountries (public data,
 *    already on the client via getDb — no extra round trip needed)
 *  - bank vs mobile-money fields, based on that country's payoutMethods
 *  - NG/GH/GH-momo name verification via resolveAccount; a plain self-typed
 *    name field (with an "unverified" notice) everywhere else
 *  - a live NGN -> local-currency conversion preview
 * Produces a record shaped to match Code.gs's initiateTransfer/webhook logic.
 * ============================================================================ */

// Best-effort mobile money network codes per country. Confirm against
// Flutterwave's current docs before a country goes live — these are not
// guaranteed to be exhaustive or perfectly current.
const MOBILE_MONEY_NETWORKS = {
  'Kenya': [{ code: 'MPS', label: 'M-Pesa' }],
  'Uganda': [{ code: 'MTN', label: 'MTN' }, { code: 'AIRTEL', label: 'Airtel' }],
  'Tanzania': [{ code: 'MPESA', label: 'M-Pesa' }, { code: 'TIGO', label: 'Tigo' }, { code: 'AIRTEL', label: 'Airtel' }],
  'Rwanda': [{ code: 'MTN', label: 'MTN' }],
  'Zambia': [{ code: 'MTN', label: 'MTN' }, { code: 'AIRTEL', label: 'Airtel' }],
  'Malawi': [{ code: 'MPAMBA', label: 'TNM Mpamba' }, { code: 'AIRTEL', label: 'Airtel Money' }],
  'Ethiopia': [{ code: 'TELEBIRR', label: 'Telebirr' }],
  'Cameroon': [{ code: 'MTN', label: 'MTN' }, { code: 'ORANGE', label: 'Orange' }],
  "Cote d'Ivoire": [{ code: 'MTN', label: 'MTN' }, { code: 'ORANGE', label: 'Orange' }, { code: 'MOOV', label: 'Moov' }],
  'Senegal': [{ code: 'ORANGE', label: 'Orange' }, { code: 'FREE', label: 'Free' }],
  'Ghana': [{ code: 'MTN', label: 'MTN' }, { code: 'VODAFONE', label: 'Vodafone' }, { code: 'AIRTELTIGO', label: 'AirtelTigo' }],
};

function round2Client_(n) { return Math.round(n * 100) / 100; }

function findCountryCfg_(db, countryName) {
  return (db.supportedCountries || []).filter(function (c) { return c.country === countryName; })[0] || null;
}

/* Renders the whole "request a withdrawal" card content. Returns an HTML
 * string; wireWithdrawalWidget() below attaches the behaviour afterward. */
function withdrawalCardHtml_(user, db, balance, withdrawalMinimum) {
  if (balance < withdrawalMinimum) {
    return '<p class="field-hint">You need at least \u20a6' + withdrawalMinimum.toLocaleString() + ' in your wallet to request a withdrawal.</p>';
  }

  if (!user.country) {
    const activeCountries = (db.supportedCountries || []).filter(function (c) { return c.active; });
    const options = (db.supportedCountries || [])
      .map(function (c) {
        const disabled = c.active ? '' : ' disabled';
        const label = c.active ? c.country : c.country + ' (coming soon)';
        return '<option value="' + escapeHtml(c.country) + '"' + disabled + '>' + escapeHtml(label) + '</option>';
      })
      .join('');
    return (
      '<div id="wd-country-picker">' +
      '<div class="field"><label for="wd-country-select">Which country are you withdrawing to?</label>' +
      '<select id="wd-country-select"><option value="">Select a country\u2026</option>' + options + '</select>' +
      (activeCountries.length ? '' : '<p class="field-hint">Withdrawals aren\u2019t open for any country yet \u2014 check back soon.</p>') +
      '</div>' +
      '<button type="button" class="btn btn-primary btn-wide" id="wd-country-save-btn"' + (activeCountries.length ? '' : ' disabled') + '>Continue</button>' +
      '</div>'
    );
  }

  const cfg = findCountryCfg_(db, user.country);
  if (!cfg || !cfg.active || !cfg.fxRate) {
    return (
      '<p class="field-hint">Withdrawals for ' + escapeHtml(user.country) + ' aren\u2019t available yet. ' +
      '<a href="mailto:support@grovia.app">Contact support</a>, or ' +
      '<button type="button" class="btn-link" id="wd-change-country-btn">choose a different country</button>.</p>'
    );
  }

  const methodOptions = cfg.payoutMethods
    .map(function (m) { return '<option value="' + m + '">' + (m === 'bank' ? 'Bank account' : 'Mobile money') + '</option>'; })
    .join('');
  const methodFieldHtml = cfg.payoutMethods.length > 1
    ? ('<div class="field"><label for="wd-method-select">Payout method</label><select id="wd-method-select">' + methodOptions + '</select></div>')
    : '<input type="hidden" id="wd-method-select" value="' + cfg.payoutMethods[0] + '" />';

  const verifiedNote = cfg.verified
    ? ''
    : '<p class="field-hint" style="color:var(--brand-deep);">This country isn\u2019t bank-verified yet \u2014 the account name below is self-entered. Double-check it before submitting.</p>';

  return (
    '<form id="wd-form">' +
    '<p class="field-hint">Withdrawing to <strong>' + escapeHtml(cfg.country) + '</strong> \u00b7 ' +
    '<button type="button" class="btn-link" id="wd-change-country-btn">change</button></p>' +
    '<div class="field"><label for="wd-amount">Amount to withdraw (\u20a6)</label>' +
    '<input type="number" id="wd-amount" min="' + withdrawalMinimum + '" max="' + balance + '" step="1" value="' + balance + '" required />' +
    '<p class="field-hint">Minimum \u20a6' + withdrawalMinimum.toLocaleString() + '. Up to your balance of \u20a6' + balance.toLocaleString() + '.</p></div>' +
    methodFieldHtml +
    '<div id="wd-bank-fields" style="display:none;">' +
    '<div class="field"><label for="wd-bank-select">Bank</label><select id="wd-bank-select"><option value="">Loading banks\u2026</option></select></div>' +
    '<div class="field"><label for="wd-account-number">Account number</label><input type="text" id="wd-account-number" /></div>' +
    '</div>' +
    '<div id="wd-momo-fields" style="display:none;">' +
    '<div class="field"><label for="wd-network-select">Provider</label><select id="wd-network-select"></select></div>' +
    '<div class="field"><label for="wd-phone-number">Phone number</label><input type="text" id="wd-phone-number" /></div>' +
    '</div>' +
    verifiedNote +
    '<div class="field" id="wd-name-field" style="display:none;"><label for="wd-account-name">Account holder name</label><input type="text" id="wd-account-name" /></div>' +
    '<div id="wd-resolve-status" class="field-hint"></div>' +
    '<div id="wd-preview" class="field-hint"></div>' +
    '<button type="submit" class="btn btn-primary btn-wide" id="wd-submit-btn" disabled>Request withdrawal</button>' +
    '</form>'
  );
}

/* Attaches behaviour to whatever withdrawalCardHtml_() just rendered.
 * ctx: { user, db, walletType, walletField, balance, withdrawalMinimum,
 *        onCountrySaved, onSubmitted } */
function wireWithdrawalWidget_(ctx) {
  const countryForm = document.getElementById('wd-country-picker');
  if (countryForm) {
    const saveBtn = document.getElementById('wd-country-save-btn');
    saveBtn.addEventListener('click', async function () {
      const select = document.getElementById('wd-country-select');
      const country = select.value;
      if (!country) return;
      saveBtn.disabled = true; saveBtn.textContent = 'Saving\u2026';
      try {
        const saved = await GroviaAPI.pushDb(function (draft) {
          const u = draft.users.find(function (x) { return x.id === ctx.user.id; });
          if (u) u.country = country;
        });
        ctx.onCountrySaved(saved);
      } catch (err) {
        saveBtn.disabled = false; saveBtn.textContent = 'Continue';
      }
    });
    return;
  }

  const changeBtn = document.getElementById('wd-change-country-btn');
  if (changeBtn) {
    changeBtn.addEventListener('click', async function () {
      try {
        const saved = await GroviaAPI.pushDb(function (draft) {
          const u = draft.users.find(function (x) { return x.id === ctx.user.id; });
          if (u) u.country = null;
        });
        ctx.onCountrySaved(saved);
      } catch (err) { /* leave as-is on failure */ }
    });
  }

  const form = document.getElementById('wd-form');
  if (!form) return; // country picker or "not available" message — nothing else to wire

  const cfg = findCountryCfg_(ctx.db, ctx.user.country);
  const methodSelect = document.getElementById('wd-method-select');
  const bankFields = document.getElementById('wd-bank-fields');
  const momoFields = document.getElementById('wd-momo-fields');
  const nameField = document.getElementById('wd-name-field');
  const resolveStatus = document.getElementById('wd-resolve-status');
  const preview = document.getElementById('wd-preview');
  const submitBtn = document.getElementById('wd-submit-btn');
  const amountInput = document.getElementById('wd-amount');

  let resolvedName = null;   // set once Flutterwave confirms the account holder
  let banksLoaded = false;

  function currentMethod() { return methodSelect ? methodSelect.value : cfg.payoutMethods[0]; }

  function updatePreview() {
    const amount = Number(amountInput.value) || 0;
    if (cfg.currency === 'NGN') { preview.textContent = ''; return; }
    const converted = round2Client_(amount * cfg.fxRate * (1 - (cfg.feePercent || 0) / 100));
    preview.textContent = '\u20a6' + amount.toLocaleString() + ' \u2192 ~' + cfg.currency + ' ' + converted.toLocaleString() +
      (cfg.feePercent ? ' after a ' + cfg.feePercent + '% fee' : '');
  }

  function updateGating() {
    const method = currentMethod();
    if (cfg.verified) {
      submitBtn.disabled = !resolvedName;
    } else {
      const nameVal = document.getElementById('wd-account-name').value.trim();
      const destOk = method === 'bank'
        ? !!document.getElementById('wd-account-number').value.trim()
        : !!document.getElementById('wd-phone-number').value.trim();
      submitBtn.disabled = !(nameVal && destOk);
    }
  }

  async function loadBanks() {
    if (banksLoaded) return;
    const bankSelect = document.getElementById('wd-bank-select');
    try {
      const result = await GroviaAPI.getBanks(ctx.user.country);
      if (result.error || !result.banks) { bankSelect.innerHTML = '<option value="">Couldn\u2019t load banks \u2014 try again</option>'; return; }
      bankSelect.innerHTML = '<option value="">Select your bank\u2026</option>' +
        result.banks.map(function (b) { return '<option value="' + escapeHtml(b.code) + '">' + escapeHtml(b.name) + '</option>'; }).join('');
      banksLoaded = true;
    } catch (err) {
      bankSelect.innerHTML = '<option value="">Couldn\u2019t load banks \u2014 try again</option>';
    }
  }

  function populateNetworks() {
    const networkSelect = document.getElementById('wd-network-select');
    const networks = MOBILE_MONEY_NETWORKS[ctx.user.country] || [];
    networkSelect.innerHTML = networks.map(function (n) { return '<option value="' + n.code + '">' + escapeHtml(n.label) + '</option>'; }).join('');
  }

  function toggleFields() {
    const method = currentMethod();
    bankFields.style.display = method === 'bank' ? '' : 'none';
    momoFields.style.display = method === 'mobile_money' ? '' : 'none';
    nameField.style.display = cfg.verified ? 'none' : '';
    resolvedName = null;
    resolveStatus.textContent = '';
    updateGating();
    if (method === 'bank') loadBanks();
    if (method === 'mobile_money') populateNetworks();
  }

  async function tryResolve() {
    if (!cfg.verified) return;
    const method = currentMethod();
    const accountBank = method === 'bank'
      ? document.getElementById('wd-bank-select').value
      : document.getElementById('wd-network-select').value;
    const accountNumber = method === 'bank'
      ? document.getElementById('wd-account-number').value.trim()
      : document.getElementById('wd-phone-number').value.trim();
    if (!accountBank || !accountNumber) return;

    resolvedName = null;
    resolveStatus.textContent = 'Checking\u2026';
    updateGating();
    try {
      const result = await GroviaAPI.resolveAccount({ country: ctx.user.country, accountNumber: accountNumber, accountBank: accountBank });
      if (result.error || !result.accountName) {
        resolveStatus.textContent = 'Couldn\u2019t verify that account \u2014 double-check the details.';
      } else {
        resolvedName = result.accountName;
        resolveStatus.textContent = '\u2713 Paying: ' + resolvedName;
      }
    } catch (err) {
      resolveStatus.textContent = 'Couldn\u2019t verify that account \u2014 double-check the details.';
    }
    updateGating();
  }

  if (methodSelect && methodSelect.tagName === 'SELECT') methodSelect.addEventListener('change', toggleFields);
  document.getElementById('wd-account-number').addEventListener('blur', tryResolve);
  document.getElementById('wd-phone-number').addEventListener('blur', tryResolve);
  document.getElementById('wd-account-name').addEventListener('input', updateGating);
  document.getElementById('wd-account-number').addEventListener('input', updateGating);
  document.getElementById('wd-phone-number').addEventListener('input', updateGating);
  amountInput.addEventListener('input', updatePreview);

  toggleFields();
  updatePreview();

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const alertEl = document.getElementById('wd-alert');
    function showAlert(msg) { if (alertEl) { alertEl.textContent = msg; alertEl.className = 'alert error'; } }
    if (alertEl) alertEl.className = 'alert';

    const amount = Number(amountInput.value);
    if (!amount || amount < ctx.withdrawalMinimum) { showAlert('Enter at least \u20a6' + ctx.withdrawalMinimum.toLocaleString() + '.'); return; }
    if (amount > ctx.balance) { showAlert('You can\u2019t withdraw more than your balance.'); return; }

    const method = currentMethod();
    const accountName = cfg.verified ? resolvedName : document.getElementById('wd-account-name').value.trim();
    if (!accountName) { showAlert('Enter the account holder name.'); return; }

    submitBtn.disabled = true; submitBtn.textContent = 'Submitting\u2026';

    const convertedAmount = round2Client_(amount * cfg.fxRate * (1 - (cfg.feePercent || 0) / 100));
    const record = {
      id: crypto.randomUUID(), userId: ctx.user.id, walletType: ctx.walletType, amount: amount,
      status: 'requested', createdAt: new Date().toISOString(), resolvedAt: null,
      country: ctx.user.country, payoutType: method,
      bankCode: method === 'bank' ? document.getElementById('wd-bank-select').value : null,
      accountNumber: method === 'bank' ? document.getElementById('wd-account-number').value.trim() : null,
      network: method === 'mobile_money' ? document.getElementById('wd-network-select').value : null,
      phoneNumber: method === 'mobile_money' ? document.getElementById('wd-phone-number').value.trim() : null,
      resolvedName: cfg.verified ? resolvedName : null,
      accountName: cfg.verified ? null : accountName,
      verified: !!cfg.verified,
      ngnAmount: amount,
      convertedAmount: convertedAmount,
      fxRateUsed: cfg.fxRate,
      feeApplied: cfg.feePercent || 0,
    };

    try {
      const saved = await GroviaAPI.pushDb(function (draft) { draft.withdrawals.push(record); });
      ctx.onSubmitted(saved);
    } catch (err) {
      showAlert('Something went wrong. Please try again.');
      submitBtn.disabled = false; submitBtn.textContent = 'Request withdrawal';
    }
  });
}

/* ----------------------------------------------------------- creator: wallet */
async function viewCreatorWallet() {
  let db, user;
  try {
    db = await GroviaAPI.getDb(true);
    user = GroviaAPI.getSession();
    const fresh = db.users.find(function (u) { return u.id === user.id; });
    if (fresh) { user = fresh; GroviaAPI.setSession(user); }
  } catch (err) {
    return { html: '<div class="wrap"><p class="skeleton-text">Couldn\u2019t load your wallet. Refresh to try again.</p></div>' };
  }

  function shell(inner) {
    return (
      '<div class="wrap"><a class="back-link" id="wallet-back-link">\u2190 Dashboard</a>' +
      '<h1 class="page-title">Wallet</h1><p class="page-sub">Your earnings and withdrawal history.</p>' +
      inner + '</div>'
    );
  }
  function wireBack() {
    const back = document.getElementById('wallet-back-link');
    if (back) back.addEventListener('click', function () { go('/creator/dashboard'); });
  }

  if (!GroviaAPI.isSubActive(user.creatorSub)) {
    return {
      html: shell(
        '<div class="card"><p style="margin:0 0 16px;color:var(--text-secondary);font-size:14px;">You need an active creator subscription to view your wallet.</p>' +
        '<a href="#/creator/dashboard" class="btn btn-primary">Go to dashboard</a></div>'
      ),
      after: wireBack,
    };
  }

  const withdrawalMinimum = (db.platformSettings && db.platformSettings.withdrawalMinimum != null) ? db.platformSettings.withdrawalMinimum : 0;
  let withdrawals = db.withdrawals
    .filter(function (w) { return w.userId === user.id && w.walletType === 'creator'; })
    .sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });

  function renderHistory() {
    if (!withdrawals.length) return '<p class="skeleton-text">No withdrawal requests yet.</p>';
    return withdrawals
      .map(function (w) {
        return (
          '<div class="wd-row"><div><p class="wd-amount">\u20a6' + Number(w.amount || 0).toLocaleString() + '</p>' +
          '<p class="wd-date">Requested ' + formatDate(w.createdAt) + '</p></div>' +
          '<span class="wd-badge ' + escapeHtml(w.status) + '">' + escapeHtml(w.status) + '</span></div>'
        );
      })
      .join('');
  }

  function render() {
    const balance = typeof user.creatorWallet === 'number' ? user.creatorWallet : 0;
    const formHtml = withdrawalCardHtml_(user, db, balance, withdrawalMinimum);

    document.getElementById('app').innerHTML = shell(
      '<div class="stat-grid"><div class="stat-card"><p class="stat-label">Wallet balance</p><p class="stat-value">\u20a6' + balance.toLocaleString() + '</p></div></div>' +
      '<div class="card"><div id="wd-alert" class="alert"></div>' + formHtml + '</div>' +
      '<div class="section-heading">Withdrawal history</div>' +
      renderHistory()
    );
    wireBack();

    wireWithdrawalWidget_({
      user: user, db: db, walletType: 'creator', walletField: 'creatorWallet',
      balance: balance, withdrawalMinimum: withdrawalMinimum,
      onCountrySaved: function (saved) {
        db = saved;
        user = db.users.find(function (u) { return u.id === user.id; }) || user;
        GroviaAPI.setSession(user);
        render();
      },
      onSubmitted: function (saved) {
        db = saved;
        user = db.users.find(function (u) { return u.id === user.id; }) || user;
        withdrawals = db.withdrawals
          .filter(function (w) { return w.userId === user.id && w.walletType === 'creator'; })
          .sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
        render();
      },
    });
  }

  return { html: '<div class="wrap"><p class="skeleton-text">Loading…</p></div>', after: render };
}

/* --------------------------------------------------------- affiliate: wallet */
async function viewAffiliateWallet() {
  let db, user;
  try {
    db = await GroviaAPI.getDb(true);
    user = GroviaAPI.getSession();
    const fresh = db.users.find(function (u) { return u.id === user.id; });
    if (fresh) { user = fresh; GroviaAPI.setSession(user); }
  } catch (err) {
    return { html: '<div class="wrap"><p class="skeleton-text">Couldn\u2019t load your wallet. Refresh to try again.</p></div>' };
  }

  function shell(inner) {
    return (
      '<div class="wrap"><a class="back-link" id="wallet-back-link">\u2190 Dashboard</a>' +
      '<h1 class="page-title">Wallet</h1><p class="page-sub">Your commission earnings and withdrawal history.</p>' +
      inner + '</div>'
    );
  }
  function wireBack() {
    const back = document.getElementById('wallet-back-link');
    if (back) back.addEventListener('click', function () { go('/affiliate/dashboard'); });
  }

  if (!GroviaAPI.isSubActive(user.affiliateSub)) {
    return {
      html: shell(
        '<div class="card"><p style="margin:0 0 16px;color:var(--text-secondary);font-size:14px;">You need an active affiliate subscription to view your wallet.</p>' +
        '<a href="#/affiliate/dashboard" class="btn btn-primary">Go to dashboard</a></div>'
      ),
      after: wireBack,
    };
  }

  const withdrawalMinimum = (db.platformSettings && db.platformSettings.withdrawalMinimum != null) ? db.platformSettings.withdrawalMinimum : 0;
  let withdrawals = db.withdrawals
    .filter(function (w) { return w.userId === user.id && w.walletType === 'affiliate'; })
    .sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });

  function renderHistory() {
    if (!withdrawals.length) return '<p class="skeleton-text">No withdrawal requests yet.</p>';
    return withdrawals
      .map(function (w) {
        return (
          '<div class="wd-row"><div><p class="wd-amount">\u20a6' + Number(w.amount || 0).toLocaleString() + '</p>' +
          '<p class="wd-date">Requested ' + formatDate(w.createdAt) + '</p></div>' +
          '<span class="wd-badge ' + escapeHtml(w.status) + '">' + escapeHtml(w.status) + '</span></div>'
        );
      })
      .join('');
  }

  function render() {
    const balance = typeof user.affiliateWallet === 'number' ? user.affiliateWallet : 0;
    const formHtml = withdrawalCardHtml_(user, db, balance, withdrawalMinimum);

    document.getElementById('app').innerHTML = shell(
      '<div class="stat-grid"><div class="stat-card"><p class="stat-label">Wallet balance</p><p class="stat-value">\u20a6' + balance.toLocaleString() + '</p></div></div>' +
      '<div class="card"><div id="wd-alert" class="alert"></div>' + formHtml + '</div>' +
      '<div class="section-heading">Withdrawal history</div>' +
      renderHistory()
    );
    wireBack();

    wireWithdrawalWidget_({
      user: user, db: db, walletType: 'affiliate', walletField: 'affiliateWallet',
      balance: balance, withdrawalMinimum: withdrawalMinimum,
      onCountrySaved: function (saved) {
        db = saved;
        user = db.users.find(function (u) { return u.id === user.id; }) || user;
        GroviaAPI.setSession(user);
        render();
      },
      onSubmitted: function (saved) {
        db = saved;
        user = db.users.find(function (u) { return u.id === user.id; }) || user;
        withdrawals = db.withdrawals
          .filter(function (w) { return w.userId === user.id && w.walletType === 'affiliate'; })
          .sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
        render();
      },
    });
  }

  return { html: '<div class="wrap"><p class="skeleton-text">Loading…</p></div>', after: render };
}

/* -------------------------------------------------------------- referrals */
async function viewReferrals() {
  let db, user;
  try {
    db = await GroviaAPI.getDb(true);
    user = GroviaAPI.getSession();
    const fresh = db.users.find(function (u) { return u.id === user.id; });
    if (fresh) { user = fresh; GroviaAPI.setSession(user); }
  } catch (err) {
    return { html: '<div class="wrap"><p class="skeleton-text">Couldn\u2019t load your referrals. Refresh to try again.</p></div>' };
  }

  function shell(inner) {
    return (
      '<div class="wrap"><a class="back-link" id="referrals-back-link">\u2190 Account</a>' +
      '<h1 class="page-title">Refer & earn</h1><p class="page-sub">Invite people to Grovia and earn every time they pay.</p>' +
      inner + '</div>'
    );
  }
  function wireBack() {
    const back = document.getElementById('referrals-back-link');
    if (back) back.addEventListener('click', function () { go('/account'); });
  }

  // Active in EITHER role counts \u2014 unlike the creator/affiliate wallet
  // pages, which each gate on their own single subscription.
  if (!GroviaAPI.isSubActive(user.creatorSub) && !GroviaAPI.isSubActive(user.affiliateSub)) {
    return {
      html: shell(
        '<div class="card"><p style="margin:0 0 16px;color:var(--text-secondary);font-size:14px;">You need an active creator or affiliate subscription to access your referral link.</p>' +
        '<a href="#/account" class="btn btn-primary">Back to account</a></div>'
      ),
      after: wireBack,
    };
  }

  const referralLink = window.location.origin + window.location.pathname + '#/signup?ref=' + user.referralCode;

  const referredUsers = db.users
    .filter(function (u) { return u.referredBy === user.referralCode; })
    .sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });

  function contributionFor(referredUserId) {
    return (db.referralEarnings || [])
      .filter(function (r) { return r.referrerId === user.id && r.referredUserId === referredUserId; })
      .reduce(function (sum, r) { return sum + (Number(r.amount) || 0); }, 0);
  }

  function renderReferredList() {
    if (!referredUsers.length) return '<p class="skeleton-text">No one has signed up with your link yet.</p>';
    return referredUsers
      .map(function (u) {
        const contribution = contributionFor(u.id);
        return (
          '<div class="wd-row"><div><p class="wd-amount">' + escapeHtml(u.name) + '</p>' +
          '<p class="wd-date">Joined ' + formatDate(u.createdAt) + '</p></div>' +
          '<p class="wd-amount" style="color:var(--brand-deep);">\u20a6' + contribution.toLocaleString() + '</p></div>'
        );
      })
      .join('');
  }

  const withdrawalMinimum = (db.platformSettings && db.platformSettings.withdrawalMinimum != null) ? db.platformSettings.withdrawalMinimum : 0;
  let withdrawals = db.withdrawals
    .filter(function (w) { return w.userId === user.id && w.walletType === 'referral'; })
    .sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });

  function renderHistory() {
    if (!withdrawals.length) return '<p class="skeleton-text">No withdrawal requests yet.</p>';
    return withdrawals
      .map(function (w) {
        return (
          '<div class="wd-row"><div><p class="wd-amount">\u20a6' + Number(w.amount || 0).toLocaleString() + '</p>' +
          '<p class="wd-date">Requested ' + formatDate(w.createdAt) + '</p></div>' +
          '<span class="wd-badge ' + escapeHtml(w.status) + '">' + escapeHtml(w.status) + '</span></div>'
        );
      })
      .join('');
  }

  function render() {
    const balance = typeof user.referralWallet === 'number' ? user.referralWallet : 0;
    const formHtml = withdrawalCardHtml_(user, db, balance, withdrawalMinimum);

    document.getElementById('app').innerHTML = shell(
      '<div class="store-link-row"><span>Your referral link: <a href="' + referralLink + '">' + referralLink.replace(/^https?:\/\//, '') + '</a></span>' +
      '<button class="copy-btn" id="copy-referral-btn" type="button">Copy</button></div>' +
      '<div class="section-heading">People you\u2019ve referred</div>' +
      renderReferredList() +
      '<div class="section-heading">Wallet</div>' +
      '<div class="stat-grid"><div class="stat-card"><p class="stat-label">Wallet balance</p><p class="stat-value">\u20a6' + balance.toLocaleString() + '</p></div></div>' +
      '<div class="card"><div id="wd-alert" class="alert"></div>' + formHtml + '</div>' +
      '<div class="section-heading">Withdrawal history</div>' +
      renderHistory()
    );
    wireBack();

    const copyBtn = document.getElementById('copy-referral-btn');
    if (copyBtn) {
      copyBtn.addEventListener('click', async function () {
        try {
          await navigator.clipboard.writeText(referralLink);
          copyBtn.textContent = 'Copied!';
          setTimeout(function () { copyBtn.textContent = 'Copy'; }, 1500);
        } catch (e) { /* clipboard unavailable */ }
      });
    }

    wireWithdrawalWidget_({
      user: user, db: db, walletType: 'referral', walletField: 'referralWallet',
      balance: balance, withdrawalMinimum: withdrawalMinimum,
      onCountrySaved: function (saved) {
        db = saved;
        user = db.users.find(function (u) { return u.id === user.id; }) || user;
        GroviaAPI.setSession(user);
        render();
      },
      onSubmitted: function (saved) {
        db = saved;
        user = db.users.find(function (u) { return u.id === user.id; }) || user;
        withdrawals = db.withdrawals
          .filter(function (w) { return w.userId === user.id && w.walletType === 'referral'; })
          .sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
        render();
      },
    });
  }

  return { html: '<div class="wrap"><p class="skeleton-text">Loading…</p></div>', after: render };
}

/* -------------------------------------------------------------- account */
async function viewAccount() {
  let db, user;
  try {
    db = await GroviaAPI.getDb(true);
    user = GroviaAPI.getSession();
    const fresh = db.users.find(function (u) { return u.id === user.id; });
    if (fresh) { user = fresh; GroviaAPI.setSession(user); }
  } catch (err) {
    return { html: '<div class="wrap"><p class="skeleton-text">Couldn\u2019t load your account. Refresh to try again.</p></div>' };
  }

  const NAME_MAX = 80;

  function subLine(label, sub, dashboardPath) {
    let statusText, statusClass;
    if (GroviaAPI.isSubActive(sub) && sub.active) {
      statusText = 'Active until ' + formatDate(sub.expiresAt);
      statusClass = 'active';
    } else if (GroviaAPI.isSubActive(sub)) {
      statusText = 'Grace period until ' + formatDate(sub.graceUntil);
      statusClass = 'grace';
    } else {
      statusText = 'Not subscribed';
      statusClass = null;
    }
    return (
      '<div class="acct-sub-row"><div><p class="acct-sub-label">' + escapeHtml(label) + '</p>' +
      '<p class="acct-sub-status">' + escapeHtml(statusText) + '</p></div>' +
      (statusClass ? '<span class="nav-badge ' + statusClass + '">' + (statusClass === 'active' ? 'active' : 'grace') + '</span>' : '') +
      '</div>'
    );
  }

  function render() {
    const referralLink = window.location.origin + window.location.pathname + '#/signup?ref=' + user.referralCode;

    const html =
      '<div class="card" style="margin-bottom:18px;">' +
      '<div id="name-alert" class="alert"></div>' +
      '<form id="name-form" novalidate>' +
      '<div class="field"><label for="acct-name">Full name</label>' +
      '<input type="text" id="acct-name" maxlength="' + NAME_MAX + '" value="' + escapeHtml(user.name || '') + '" required /></div>' +
      '<div class="field"><label>Email</label><p class="field-hint" style="margin-top:0;">' + escapeHtml(user.email) + ' \u2014 contact support to change your email.</p></div>' +
      '<button type="submit" class="btn btn-primary btn-wide" id="name-submit-btn">Save changes</button>' +
      '</form></div>' +

      '<div class="card" style="margin-bottom:18px;">' +
      '<div id="pw-alert" class="alert"></div>' +
      '<p style="margin:0 0 12px;font-size:13.5px;color:var(--text-secondary);">We\u2019ll email you a link to set a new password.</p>' +
      '<button type="button" class="btn btn-outline btn-wide" id="pw-reset-btn">Send password reset email</button>' +
      '</div>' +

      '<div class="section-heading">Referrals</div>' +
      '<div class="store-link-row"><span>Your referral link: <a href="' + referralLink + '">' + referralLink.replace(/^https?:\/\//, '') + '</a></span>' +
      '<button class="copy-btn" id="copy-referral-btn" type="button">Copy</button></div>' +
      '<p class="field-hint" style="margin:-12px 0 20px;"><a href="#/referrals" style="color:var(--brand-deep);font-weight:600;">View who you\u2019ve referred and your earnings \u2192</a></p>' +

      '<div class="section-heading">Subscriptions</div>' +
      '<div class="card">' +
      subLine('Creator', user.creatorSub, '/creator/dashboard') +
      '<div style="height:10px;"></div>' +
      subLine('Affiliate', user.affiliateSub, '/affiliate/dashboard') +
      '</div>';

    document.getElementById('app').innerHTML = '<div class="wrap"><h1 class="page-title">Account settings</h1><p class="page-sub">Manage your profile and subscriptions.</p>' + html + '</div>';

    document.getElementById('name-form').addEventListener('submit', onSaveName);
    document.getElementById('pw-reset-btn').addEventListener('click', onSendReset);

    const copyBtn = document.getElementById('copy-referral-btn');
    if (copyBtn) {
      copyBtn.addEventListener('click', async function () {
        try {
          await navigator.clipboard.writeText(referralLink);
          copyBtn.textContent = 'Copied!';
          setTimeout(function () { copyBtn.textContent = 'Copy'; }, 1500);
        } catch (e) { /* clipboard unavailable */ }
      });
    }
  }

  async function onSaveName(e) {
    e.preventDefault();
    const btn = document.getElementById('name-submit-btn');
    const name = document.getElementById('acct-name').value.trim();
    function showAlert(msg, kind) {
      const el = document.getElementById('name-alert');
      el.textContent = msg; el.className = 'alert ' + (kind || 'error');
    }
    document.getElementById('name-alert').className = 'alert';
    if (!name) { showAlert('Your name can\u2019t be empty.'); return; }

    btn.disabled = true; btn.textContent = 'Saving\u2026';
    try {
      const saved = await GroviaAPI.pushDb(function (draft) {
        const existing = draft.users.find(function (u) { return u.id === user.id; });
        if (existing) existing.name = name;
      });
      db = saved;
      user = db.users.find(function (u) { return u.id === user.id; });
      GroviaAPI.setSession(user);
      showAlert('Changes saved.', 'info');
      btn.disabled = false; btn.textContent = 'Save changes';
    } catch (err) {
      showAlert('Something went wrong. Please try again.');
      btn.disabled = false; btn.textContent = 'Save changes';
    }
  }

  async function onSendReset() {
    const btn = document.getElementById('pw-reset-btn');
    function showAlert(msg, kind) {
      const el = document.getElementById('pw-alert');
      el.textContent = msg; el.className = 'alert ' + (kind || 'error');
    }
    document.getElementById('pw-alert').className = 'alert';
    btn.disabled = true; btn.textContent = 'Sending\u2026';
    try {
      await GroviaAPI.requestPasswordReset(user.email);
      showAlert('Check your email for a reset link. It expires in 1 hour.', 'info');
    } catch (err) {
      showAlert('Something went wrong. Please try again.');
    }
    btn.disabled = false; btn.textContent = 'Send password reset email';
  }

  return { html: '<div class="wrap"><p class="skeleton-text">Loading…</p></div>', after: render };
}
</script>
