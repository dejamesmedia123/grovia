<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="630" /></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- base -->
    <rect x="0" y="0" width="1200" height="630" fill="#F7FAF0" />

    <!-- soft diagonal field, bottom-left to upper-right, sits behind the vine -->
    <path d="M -60,630 L 480,630 C 700,520 640,300 940,180 L 1260,60 L 1260,-60 L -60,-60 Z"
          fill="#EAF3DE" />

    <!-- growth vine: reads left-to-right as the brand name (grow + via) -->
    <path d="M 640,566 C 742,540 706,438 812,404 C 918,370 882,270 988,232 C 1060,206 1042,150 1128,104"
          fill="none" stroke="#27500A" stroke-width="9" stroke-linecap="round" opacity="0.9" />

    <!-- small leaf accents off the vine -->
    <ellipse cx="770" cy="452" rx="19" ry="10" fill="#639922" transform="rotate(-34 770 452)" />
    <ellipse cx="944" cy="316" rx="17" ry="9" fill="#639922" transform="rotate(-30 944 316)" opacity="0.85" />

    <!-- nodes: earnings compounding as the vine climbs -->
    <circle cx="640" cy="566" r="13" fill="#EAF3DE" stroke="#639922" stroke-width="5" />
    <circle cx="812" cy="404" r="19" fill="#639922" />
    <circle cx="988" cy="232" r="25" fill="#27500A" />
    <circle cx="1128" cy="104" r="33" fill="#639922" />
    <circle cx="1128" cy="104" r="33" fill="none" stroke="#EAF3DE" stroke-width="6" />

    <!-- wordmark + tagline, left-aligned, quiet against the motif -->
    <text x="80" y="322" font-family="'DejaVu Sans', Verdana, Arial, sans-serif" font-weight="700"
          font-size="112" fill="#12210A" letter-spacing="-2">Grovia</text>

    <text x="82" y="384" font-family="'DejaVu Sans', Verdana, Arial, sans-serif" font-weight="400"
          font-size="29" fill="#607057">Sell digital products. Earn as an affiliate.</text>
    <text x="82" y="424" font-family="'DejaVu Sans', Verdana, Arial, sans-serif" font-weight="400"
          font-size="29" fill="#607057">Get paid instantly, anywhere in Africa.</text>

    <text x="82" y="552" font-family="'DejaVu Sans', Verdana, Arial, sans-serif" font-weight="400"
          font-size="22" fill="#87927F">groviaio.vercel.app</text>
  </g>
</svg>
